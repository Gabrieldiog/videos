<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .cena {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
        z-index: 1;
      }
      .dip {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0.4;
        z-index: 2;
      }
      .texto {
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="32.6"
      data-width="1080"
      data-height="1920"
    >
      <!-- Filmagem (clipes Wan 2.2 preparados por scripts/preparar_motion.py) -->
      <video id="v1" class="clip cena" src="assets/clips/01.mp4" muted playsinline
        data-start="0" data-duration="4.2" data-media-start="0.3" data-track-index="0"></video>
      <video id="v2" class="clip cena" src="assets/clips/02.mp4" muted playsinline
        data-start="4.2" data-duration="3.8" data-media-start="0.1" data-playback-rate="1.25" data-track-index="0"></video>
      <video id="v3" class="clip cena" src="assets/clips/03.mp4" muted playsinline
        data-start="8" data-duration="3.8" data-media-start="0.15" data-playback-rate="1.25" data-track-index="0"></video>
      <video id="v4" class="clip cena" src="assets/clips/04.mp4" muted playsinline
        data-start="11.8" data-duration="2.8" data-media-start="0.1" data-playback-rate="1.35" data-track-index="0"></video>
      <video id="v5" class="clip cena" src="assets/clips/05.mp4" muted playsinline
        data-start="14.6" data-duration="2.8" data-media-start="0.2" data-playback-rate="1.3" data-track-index="0"></video>
      <video id="v6" class="clip cena" src="assets/clips/06.mp4" muted playsinline
        data-start="17.4" data-duration="2.7" data-media-start="0.2" data-playback-rate="1.3" data-track-index="0"></video>
      <video id="v7" class="clip cena" src="assets/clips/07.mp4" muted playsinline
        data-start="20.1" data-duration="2.7" data-media-start="0.2" data-playback-rate="1.3" data-track-index="0"></video>
      <video id="v8" class="clip cena" src="assets/clips/08.mp4" muted playsinline
        data-start="22.8" data-duration="2" data-media-start="0.1" data-playback-rate="0.5" data-track-index="0"></video>

      <!-- Dip cuts: o quadro que sai escurece 40% por 3 quadros antes do corte -->
      <div id="dip1" class="clip dip" data-start="4.1" data-duration="0.1" data-track-index="1"></div>
      <div id="dip2" class="clip dip" data-start="14.5" data-duration="0.1" data-track-index="1"></div>
      <div id="dip3" class="clip dip" data-start="22.7" data-duration="0.1" data-track-index="1"></div>

      <!-- Camada de motion -->
      <div id="gancho" class="clip texto" data-composition-id="gancho" data-composition-src="compositions/gancho.html"
        data-start="0" data-duration="4.2" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="familia" class="clip texto" data-composition-id="familia" data-composition-src="compositions/familia.html"
        data-start="4.4" data-duration="3.4" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="manha" class="clip texto" data-composition-id="manha" data-composition-src="compositions/manha.html"
        data-start="8.3" data-duration="3.3" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="tarde" class="clip texto" data-composition-id="tarde" data-composition-src="compositions/tarde.html"
        data-start="11.95" data-duration="2.6" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="quarto" class="clip texto" data-composition-id="quarto" data-composition-src="compositions/quarto.html"
        data-start="17.55" data-duration="3" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="aqui" class="clip texto" data-composition-id="aqui" data-composition-src="compositions/aqui.html"
        data-start="22.9" data-duration="1.9" data-track-index="2" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="final" class="clip texto" data-composition-id="final" data-composition-src="compositions/final.html"
        data-start="24.8" data-duration="7.8" data-track-index="3" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <!-- Piano: Chopin, Noturno Op. 9 nº 2 (Musopen, CC0) -->
      <audio id="piano" class="clip" src="assets/audio/piano.mp3" data-start="0" data-duration="32.6"
        data-media-start="1.1" data-volume="2.5" data-fade-in="0.4" data-fade-out="2.5" data-track-index="4"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
